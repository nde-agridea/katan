syntax = "proto3";

option csharp_namespace = "Katan.Shared.Protos";

package katan;

// ─────────────────────────── Common value types ──────────────────────────────

message TilePositionProto {
  int32 q = 1;
  int32 r = 2;
}

message IntersectionProto {
  repeated TilePositionProto adjacent_tiles = 1;
}

message EdgeProto {
  repeated TilePositionProto adjacent_tiles = 1;
}

enum ResourceTypeProto {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  WOOD   = 1;
  BRICK  = 2;
  WHEAT  = 3;
  SHEEP  = 4;
  STONE  = 5;
  IRON   = 6;
}

enum TileTypeProto {
  TILE_TYPE_UNSPECIFIED = 0;
  FOREST   = 1;
  QUARRY   = 2;
  FIELD    = 3;
  PASTURE  = 4;
  MOUNTAIN = 5;
  MINE     = 6;
  DESERT   = 7;
}

enum DevelopmentCardTypeProto {
  DEVELOPMENT_CARD_TYPE_UNSPECIFIED = 0;
  KNIGHT         = 1;
  VICTORY_POINT  = 2;
  ROAD_BUILDING  = 3;
  MONOPOLY       = 4;
  EXCESS         = 5;
  DISASTER       = 6;
}

enum PortTypeProto {
  PORT_TYPE_UNSPECIFIED = 0;
  GENERIC     = 1;
  SPECIALIZED = 2;
}

enum GamePhaseProto {
  GAME_PHASE_UNSPECIFIED  = 0;
  MAP_GENERATION          = 1;
  MAP_VOTING              = 2;
  INITIAL_PLACEMENT       = 3;
  IN_PROGRESS             = 4;
  ENDED                   = 5;
}

enum TurnPhaseProto {
  TURN_PHASE_UNSPECIFIED = 0;
  WAITING_FOR_ROLL       = 1;
  RESOURCE_PRODUCTION    = 2;
  DISCARD                = 3;
  ROBBER_MOVEMENT        = 4;
  ROBBER_TRIBUTE         = 5;
  TRADE                  = 6;
  BUILD                  = 7;
  END                    = 8;
}

// ─────────────────────────── State snapshot ──────────────────────────────────

message TileProto {
  TilePositionProto position = 1;
  TileTypeProto     type     = 2;
  int32             token    = 3;
  string            owner_id = 4;
}

message PortProto {
  EdgeProto     coastal_edge  = 1;
  PortTypeProto port_type     = 2;
  ResourceTypeProto resource  = 3;
}

message ResourceAmountProto {
  ResourceTypeProto type   = 1;
  int32             amount = 2;
}

message StructureProto {
  string            player_id = 1;
  IntersectionProto location  = 2;
}

message RoadProto {
  string    player_id = 1;
  EdgeProto location  = 2;
}

message ArmyProto {
  string            player_id = 1;
  TilePositionProto position  = 2;
}

message PlayerStateProto {
  string                     id                  = 1;
  string                     name                = 2;
  repeated ResourceAmountProto hand              = 3;
  int32                      remaining_settlements = 4;
  int32                      remaining_cities    = 5;
  int32                      remaining_roads     = 6;
  int32                      remaining_armies    = 7;
  int32                      victory_points      = 8;
  bool                       has_longest_road    = 9;
  bool                       has_largest_army    = 10;
}

message BoardStateProto {
  repeated TileProto  tiles           = 1;
  repeated PortProto  ports           = 2;
  TilePositionProto   robber_position = 3;
}

message GameState {
  string             game_id         = 1;
  GamePhaseProto     game_phase      = 2;
  TurnPhaseProto     turn_phase      = 3;
  string             active_player_id = 4;
  repeated PlayerStateProto players = 5;
  BoardStateProto    board           = 6;
  repeated StructureProto settlements = 7;
  repeated StructureProto cities      = 8;
  repeated RoadProto      roads       = 9;
  repeated ArmyProto      armies      = 10;
  string             winner_id       = 11;
}

// ─────────────────────────── Request messages ────────────────────────────────

message CreateGameRequest {
  repeated string player_names = 1;
  string first_player_id       = 2;
}

message VoteMapRequest {
  string game_id   = 1;
  string player_id = 2;
  bool   approve   = 3;
}

message PlaceInitialSettlementRequest {
  string game_id          = 1;
  string player_id        = 2;
  IntersectionProto location = 3;
}

message PlaceInitialRoadRequest {
  string game_id   = 1;
  string player_id = 2;
  EdgeProto location = 3;
}

message RollDiceRequest {
  string game_id   = 1;
  string player_id = 2;
}

message DiscardResourcesRequest {
  string game_id                    = 1;
  string player_id                  = 2;
  repeated ResourceAmountProto discards = 3;
}

message MoveRobberRequest {
  string game_id           = 1;
  string player_id         = 2;
  TilePositionProto position = 3;
  string steal_from_player_id = 4;
}

message PayTributeRequest {
  string game_id         = 1;
  string player_id       = 2;
  ResourceTypeProto resource = 3;
}

message BankTradeRequest {
  string game_id              = 1;
  string player_id            = 2;
  ResourceTypeProto give      = 3;
  int32             amount    = 4;
  ResourceTypeProto receive   = 5;
}

message PortTradeRequest {
  string game_id              = 1;
  string player_id            = 2;
  ResourceTypeProto give      = 3;
  int32             amount    = 4;
  ResourceTypeProto receive   = 5;
}

message OfferTradeRequest {
  string game_id                      = 1;
  string offering_player_id           = 2;
  string target_player_id             = 3;
  repeated ResourceAmountProto offering   = 4;
  repeated ResourceAmountProto requesting = 5;
}

message RespondTradeRequest {
  string game_id              = 1;
  string offering_player_id   = 2;
  string responding_player_id = 3;
  bool   accept               = 4;
}

message EndTradeRequest {
  string game_id   = 1;
  string player_id = 2;
}

message BuildRoadRequest {
  string game_id   = 1;
  string player_id = 2;
  EdgeProto location = 3;
}

message BuildSettlementRequest {
  string game_id            = 1;
  string player_id          = 2;
  IntersectionProto location = 3;
}

message UpgradeCityRequest {
  string game_id            = 1;
  string player_id          = 2;
  IntersectionProto location = 3;
}

message BuildArmyRequest {
  string game_id              = 1;
  string player_id            = 2;
  TilePositionProto position  = 3;
}

message MoveArmyRequest {
  string game_id              = 1;
  string player_id            = 2;
  TilePositionProto from      = 3;
  TilePositionProto to        = 4;
}

message AttackRequest {
  string game_id               = 1;
  string player_id             = 2;
  TilePositionProto from_tile  = 3;
  TilePositionProto target_tile = 4;
}

message BuyDevelopmentCardRequest {
  string game_id   = 1;
  string player_id = 2;
}

message PlayKnightRequest {
  string game_id                = 1;
  string player_id              = 2;
  TilePositionProto new_robber_position = 3;
  string steal_from_player_id   = 4;
}

message PlayVictoryPointRequest {
  string game_id   = 1;
  string player_id = 2;
}

message PlayRoadBuildingRequest {
  string game_id       = 1;
  string player_id     = 2;
  EdgeProto road_location = 3;
}

message PlayMonopolyRequest {
  string game_id              = 1;
  string player_id            = 2;
  ResourceTypeProto resource  = 3;
}

message PlayExcessRequest {
  string game_id               = 1;
  string player_id             = 2;
  ResourceTypeProto resource1  = 3;
  ResourceTypeProto resource2  = 4;
}

message PlayDisasterRequest {
  string game_id               = 1;
  string player_id             = 2;
  TilePositionProto tile       = 3;
}

message EndBuildRequest {
  string game_id   = 1;
  string player_id = 2;
}

message EndTurnRequest {
  string game_id   = 1;
  string player_id = 2;
}

// ─────────────────────────── Service definition ──────────────────────────────

service GameService {
  // Lifecycle
  rpc CreateGame              (CreateGameRequest)             returns (GameState);
  rpc VoteMap                 (VoteMapRequest)                returns (GameState);

  // Initial placement
  rpc PlaceInitialSettlement  (PlaceInitialSettlementRequest) returns (GameState);
  rpc PlaceInitialRoad        (PlaceInitialRoadRequest)       returns (GameState);

  // Turn: roll
  rpc RollDice                (RollDiceRequest)               returns (GameState);
  rpc DiscardResources        (DiscardResourcesRequest)       returns (GameState);
  rpc MoveRobber              (MoveRobberRequest)             returns (GameState);
  rpc PayTribute              (PayTributeRequest)             returns (GameState);

  // Turn: trade
  rpc BankTrade               (BankTradeRequest)              returns (GameState);
  rpc PortTrade               (PortTradeRequest)              returns (GameState);
  rpc OfferTrade              (OfferTradeRequest)             returns (GameState);
  rpc RespondTrade            (RespondTradeRequest)           returns (GameState);
  rpc EndTrade                (EndTradeRequest)               returns (GameState);

  // Turn: build
  rpc BuildRoad               (BuildRoadRequest)              returns (GameState);
  rpc BuildSettlement         (BuildSettlementRequest)        returns (GameState);
  rpc UpgradeCity             (UpgradeCityRequest)            returns (GameState);
  rpc BuildArmy               (BuildArmyRequest)              returns (GameState);
  rpc MoveArmy                (MoveArmyRequest)               returns (GameState);
  rpc Attack                  (AttackRequest)                 returns (GameState);
  rpc BuyDevelopmentCard      (BuyDevelopmentCardRequest)     returns (GameState);
  rpc PlayKnight              (PlayKnightRequest)             returns (GameState);
  rpc PlayVictoryPoint        (PlayVictoryPointRequest)       returns (GameState);
  rpc PlayRoadBuilding        (PlayRoadBuildingRequest)       returns (GameState);
  rpc PlayMonopoly            (PlayMonopolyRequest)           returns (GameState);
  rpc PlayExcess              (PlayExcessRequest)             returns (GameState);
  rpc PlayDisaster            (PlayDisasterRequest)           returns (GameState);
  rpc EndBuild                (EndBuildRequest)               returns (GameState);
  rpc EndTurn                 (EndTurnRequest)                returns (GameState);
}
